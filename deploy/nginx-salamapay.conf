upstream salamapay_gunicorn {
    server unix:/var/www/salamapay/run/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name 144.91.64.180;

    client_max_body_size 10M;

    # Static files
    location /static/ {
        alias /var/www/salamapay/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files (if any)
    location /media/ {
        alias /var/www/salamapay/media/;
        expires 30d;
    }

    # API + Django app
    location / {
        proxy_pass http://salamapay_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Selcom webhook - increase timeout
    location /api/v1/webhooks/ {
        proxy_pass http://salamapay_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
