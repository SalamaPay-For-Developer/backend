# ============================================================
# PLESK ADDITIONAL NGINX DIRECTIVES
# ============================================================
# Hii file haifanyiwi "cp" kwenye /etc/nginx/.
# Badala yake, nakili maudhui yote hapa na uyapaste kwenye:
#
#   Plesk Panel > Domains > lipasalama.co.tz >
#   Apache & nginx Settings > Additional nginx directives
#
# Kisha bonyeza "Apply" / "OK".
# ============================================================

# Static files
location /static/ {
    alias /var/www/vhosts/elanbrands.net/lipasalama.co.tz/staticfiles/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# Media files
location /media/ {
    alias /var/www/vhosts/elanbrands.net/lipasalama.co.tz/media/;
    expires 30d;
}

# Selcom webhook - timeout ya sekunde 60
location /api/v1/webhooks/ {
    proxy_pass http://unix:/var/www/vhosts/elanbrands.net/lipasalama.co.tz/run/gunicorn.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# API + Django app (location / lazima iwe mwisho)
location / {
    proxy_pass http://unix:/var/www/vhosts/elanbrands.net/lipasalama.co.tz/run/gunicorn.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    client_max_body_size 10M;
}
