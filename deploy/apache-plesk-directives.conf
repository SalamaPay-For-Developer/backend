# ============================================================
# PLESK ADDITIONAL APACHE DIRECTIVES
# ============================================================
# Plesk hii inatumia Apache tu (haina nginx).
# Nakili maudhui yote hapa na uyapaste kwenye:
#
#   Plesk Panel > Domains > lipasalama.co.tz >
#   Apache & nginx Settings > Additional Apache directives
#
# AU andika kwenye file hii kwa SSH:
#   /var/www/vhosts/system/lipasalama.co.tz/conf/vhost.conf
#
# Kisha reconfigure: plesk bin site --reconfigure-web-server lipasalama.co.tz
# ============================================================

# Static files
Alias /static/ /var/www/vhosts/elanbrands.net/lipasalama.co.tz/staticfiles/
<Directory /var/www/vhosts/elanbrands.net/lipasalama.co.tz/staticfiles>
    Require all granted
    ExpiresActive On
    ExpiresDefault "access plus 30 days"
</Directory>

# Media files
Alias /media/ /var/www/vhosts/elanbrands.net/lipasalama.co.tz/media/
<Directory /var/www/vhosts/elanbrands.net/lipasalama.co.tz/media>
    Require all granted
    ExpiresActive On
    ExpiresDefault "access plus 30 days"
</Directory>

# Reverse proxy to Gunicorn
ProxyPreserveHost On
ProxyRequests Off

# Webhook - timeout mrefu
<Location /api/v1/webhooks/>
    ProxyPass http://127.0.0.1:8001/api/v1/webhooks/ timeout=60
    ProxyPassReverse http://127.0.0.1:8001/api/v1/webhooks/
</Location>

# API + Django app
ProxyPass / http://127.0.0.1:8001/
ProxyPassReverse / http://127.0.0.1:8001/
